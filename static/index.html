<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cobros MP">
<meta name="theme-color" content="#0077a8">
<link rel="manifest" href="/manifest.json">
<title>Dashboard MP</title>
<style>
  /* ── Tokens ── */
  :root {
    --bg:      #eef2f6;
    --bg2:     #ffffff;
    --bg3:     #e2e8f0;
    --border:  #cbd5e0;
    --fg:      #1a202c;
    --fg2:     #64748b;
    --accent:  #0077a8;
    --accent2: #005f87;
    --green:   #276749;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg:      #0f1117;
    --bg2:     #1a1d27;
    --bg3:     #22263a;
    --border:  #2e3350;
    --fg:      #e8eaf0;
    --fg2:     #8b92b0;
    --accent:  #38b2d8;
    --accent2: #009ee3;
    --green:   #4ade80;
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--fg); min-height: 100vh;
         transition: background .2s, color .2s; }

  /* HEADER */
  header { background: var(--accent); color: white; padding: 14px 16px;
           display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 1.1rem; flex: 1; }
  .hbtn { background: rgba(255,255,255,0.18); border: none; color: white;
          border-radius: 6px; padding: 6px 10px; cursor: pointer;
          font-size: 0.85rem; }

  /* CONFIG PANEL */
  #panel-config { display: none; background: var(--bg2); padding: 16px;
                  border-bottom: 1px solid var(--border); }
  #panel-config label { display: block; font-size: 0.8rem; color: var(--fg2);
                        margin-bottom: 3px; margin-top: 10px; }
  #panel-config input { width: 100%; border: 1px solid var(--border);
                        border-radius: 6px; padding: 8px 10px; font-size: 0.95rem;
                        background: var(--bg); color: var(--fg); }
  #btn-guardar { margin-top: 12px; background: var(--accent); color: white;
                 border: none; border-radius: 6px; padding: 9px 18px;
                 cursor: pointer; font-size: 0.9rem; width: 100%; }

  /* FILTROS */
  #filtros { background: var(--bg2); padding: 12px 16px;
             border-bottom: 1px solid var(--border); }
  .fila-filtros { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .fila-filtros label { font-size: 0.75rem; color: var(--fg2); display: block;
                        margin-bottom: 2px; }
  .fila-filtros input, .fila-filtros select {
    border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 8px; font-size: 0.85rem; width: 100%;
    background: var(--bg); color: var(--fg); }
  .f-fecha { flex: 1; min-width: 130px; }
  .f-monto { flex: 1; min-width: 110px; }
  .f-tipo  { flex: 1; min-width: 130px; }
  #btn-buscar { background: var(--accent); color: white; border: none;
                border-radius: 6px; padding: 9px 20px; cursor: pointer;
                font-size: 0.9rem; white-space: nowrap; align-self: flex-end; }
  #btn-excel  { background: var(--green); color: white; border: none;
                border-radius: 6px; padding: 9px 14px; cursor: pointer;
                font-size: 0.9rem; white-space: nowrap; align-self: flex-end; }

  /* STATS */
  #stats { display: flex; gap: 10px; padding: 12px 16px; flex-wrap: wrap; }
  .stat-card { background: var(--bg2); border: 1px solid var(--border);
               border-radius: 8px; padding: 10px 14px;
               flex: 1; min-width: 130px; }
  .stat-card .label { font-size: 0.7rem; color: var(--fg2);
                      text-transform: uppercase; letter-spacing: .04em; }
  .stat-card .value { font-size: 1.25rem; font-weight: 700; color: var(--accent);
                      margin-top: 2px; }

  /* TABLA */
  #tabla-wrap { overflow-x: auto; padding: 0 16px 80px; }
  table { width: 100%; border-collapse: collapse; background: var(--bg2);
          border-radius: 8px; overflow: hidden;
          border: 1px solid var(--border); font-size: 0.85rem; }
  th { background: var(--bg3); padding: 10px 12px; text-align: left;
       font-weight: 600; color: var(--fg2); white-space: nowrap;
       border-bottom: 1px solid var(--border); }
  td { padding: 9px 12px; border-top: 1px solid var(--border); color: var(--fg); }
  tr:hover td { background: var(--bg3); }
  .monto { text-align: right; font-variant-numeric: tabular-nums; }
  .acum  { text-align: right; font-variant-numeric: tabular-nums;
           color: var(--green); font-weight: 600; }

  #msg { text-align: center; padding: 40px 16px; color: var(--fg2); font-size: 0.9rem; }

  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
           background: var(--fg); color: var(--bg); padding: 10px 20px;
           border-radius: 20px; font-size: 0.85rem; opacity: 0;
           transition: opacity .3s; pointer-events: none; z-index: 999;
           white-space: nowrap; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1 id="titulo-header">Dashboard MP</h1>
  <button class="hbtn" id="btn-tema" title="Modo oscuro">🌙</button>
  <button class="hbtn" id="btn-config">⚙ Config</button>
</header>

<div id="panel-config">
  <label>Nombre del dashboard</label>
  <input id="cfg-nombre" type="text" placeholder="Ej: Cooperadora 2026">
  <label>Access Token de Mercado Pago</label>
  <input id="cfg-token" type="password" placeholder="APP_USR-...">
  <button id="btn-guardar">💾 Guardar</button>
</div>

<div id="filtros">
  <div class="fila-filtros">
    <div class="f-fecha">
      <label>Desde</label>
      <input type="date" id="f-desde">
    </div>
    <div class="f-fecha">
      <label>Hasta</label>
      <input type="date" id="f-hasta">
    </div>
    <div class="f-monto">
      <label>Monto exacto</label>
      <input type="number" id="f-monto" placeholder="Ej: 55000">
    </div>
    <div class="f-tipo">
      <label>Tipo</label>
      <select id="f-tipo">
        <option value="received">Recibidos</option>
        <option value="sent">Realizados</option>
        <option value="all">Todos</option>
      </select>
    </div>
    <button id="btn-buscar">🔍 Buscar</button>
    <button id="btn-excel">📥 Excel</button>
  </div>
</div>

<div id="stats">
  <div class="stat-card">
    <div class="label">Registros</div>
    <div class="value" id="st-registros">—</div>
  </div>
  <div class="stat-card">
    <div class="label">Total aprobado</div>
    <div class="value" id="st-total">—</div>
  </div>
</div>

<div id="tabla-wrap">
  <div id="msg">Configurá tu token y hacé una búsqueda.</div>
  <table id="tabla" style="display:none">
    <thead>
      <tr>
        <th>Fecha</th>
        <th>ID</th>
        <th class="monto">Monto</th>
        <th class="acum">Acumulado</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<div id="toast"></div>

<script>
function lsGet(k){ try{ return localStorage.getItem(k)||""; }catch(e){ return ""; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

// ── Tema ──────────────────────────────────────────────────────────────
const html = document.documentElement;
const btnTema = document.getElementById("btn-tema");

function aplicarTema(t){
  html.setAttribute("data-theme", t);
  btnTema.textContent = t === "dark" ? "☀️" : "🌙";
  lsSet("mp_tema", t);
}

const temaGuardado = lsGet("mp_tema") || "light";
aplicarTema(temaGuardado);

btnTema.onclick = () => {
  aplicarTema(html.getAttribute("data-theme") === "dark" ? "light" : "dark");
};

// ── Inicializar ───────────────────────────────────────────────────────
const hoy = new Date().toISOString().slice(0,10);
document.getElementById("f-desde").value = hoy;
document.getElementById("f-hasta").value = hoy;

const nombre = lsGet("mp_nombre") || "Dashboard MP";
document.getElementById("titulo-header").textContent = nombre;
document.title = nombre;
document.getElementById("cfg-nombre").value = nombre;
document.getElementById("cfg-token").value  = lsGet("mp_token");

// ── Config panel ──────────────────────────────────────────────────────
document.getElementById("btn-config").onclick = () => {
  const p = document.getElementById("panel-config");
  p.style.display = p.style.display === "none" ? "block" : "none";
};
document.getElementById("btn-guardar").onclick = () => {
  const n = document.getElementById("cfg-nombre").value.trim() || "Dashboard MP";
  const t = document.getElementById("cfg-token").value.trim();
  lsSet("mp_nombre", n);
  lsSet("mp_token",  t);
  document.getElementById("titulo-header").textContent = n;
  document.title = n;
  document.getElementById("panel-config").style.display = "none";
  toast("✅ Guardado");
};

// ── Buscar ────────────────────────────────────────────────────────────
let datosActuales = [];
document.getElementById("btn-buscar").onclick = buscar;

async function buscar(){
  const token = lsGet("mp_token");
  if(!token){ toast("⚠ Primero guardá tu Access Token en Config"); return; }

  const desde = document.getElementById("f-desde").value;
  const hasta = document.getElementById("f-hasta").value;
  const monto = document.getElementById("f-monto").value;
  const tipo  = document.getElementById("f-tipo").value;

  document.getElementById("msg").textContent = "Consultando...";
  document.getElementById("msg").style.display = "block";
  document.getElementById("tabla").style.display = "none";
  document.getElementById("st-registros").textContent = "—";
  document.getElementById("st-total").textContent = "—";

  const params = new URLSearchParams({ token, tipo, desde, hasta });
  if(monto) params.append("monto", monto);

  try {
    const res  = await fetch("/api/pagos?" + params);
    const data = await res.json();
    if(data.error){ toast("❌ " + data.error); document.getElementById("msg").textContent = "Error: " + data.error; return; }
    datosActuales = data.rows;
    renderTabla(data.rows, data.total);
  } catch(e) {
    toast("❌ Error de conexión");
    document.getElementById("msg").textContent = "Error de conexión.";
  }
}

function fmt(n){ return n == null ? "—" : "$ " + Math.round(n).toLocaleString("es-AR"); }

function renderTabla(rows, total){
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";
  document.getElementById("st-registros").textContent = rows.length;
  document.getElementById("st-total").textContent = fmt(total);

  if(!rows.length){
    document.getElementById("msg").textContent = "Sin resultados para ese período.";
    document.getElementById("msg").style.display = "block";
    document.getElementById("tabla").style.display = "none";
    return;
  }

  rows.forEach(r => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${r.fecha}</td>
      <td style="font-size:0.8rem;color:var(--fg2)">${r.id}</td>
      <td class="monto">${fmt(r.monto)}</td>
      <td class="acum">${r.acumulado != null ? fmt(r.acumulado) : "—"}</td>
    `;
    tbody.appendChild(tr);
  });

  document.getElementById("msg").style.display = "none";
  document.getElementById("tabla").style.display = "table";
}

// ── Excel ─────────────────────────────────────────────────────────────
document.getElementById("btn-excel").onclick = exportarExcel;

function exportarExcel(){
  if(!datosActuales.length){ toast("Sin datos para exportar"); return; }
  let csv = "Fecha,ID,Monto,Acumulado\n";
  datosActuales.forEach(r => {
    csv += `"${r.fecha}","${r.id}","${r.monto}","${r.acumulado ?? ""}"\n`;
  });
  const blob = new Blob(["﻿"+csv], {type:"text/csv;charset=utf-8"});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href = url;
  a.download = (lsGet("mp_nombre")||"pagos") + "_" + new Date().toISOString().slice(0,10) + ".csv";
  a.click();
  URL.revokeObjectURL(url);
  toast("✅ Archivo descargado");
}

// ── Toast ─────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2800);
}

// ── Service Worker ────────────────────────────────────────────────────
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch(() => {});
}
</script>
</body>
</html>
