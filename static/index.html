<title>Cobros MP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cobros MP">
<meta name="theme-color" content="#009ee3">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

<style>
/* ── Tokens ─────────────────────────────────────────────────────────── */
:root {
  --bg:        #0f1117;
  --bg2:       #1a1d27;
  --bg3:       #22263a;
  --border:    #2e3350;
  --fg:        #e8eaf0;
  --fg2:       #8b92b0;
  --accent:    #009ee3;
  --accent-dk: #007ab8;
  --accent-gl: rgba(0,158,227,.12);
  --green:     #34d399;
  --green-gl:  rgba(52,211,153,.1);
  --red:       #f87171;
  --r:         12px;
  --r-sm:      8px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:        #f0f4f8;
    --bg2:       #ffffff;
    --bg3:       #e8edf5;
    --border:    #d1d9e6;
    --fg:        #1a202c;
    --fg2:       #5a6480;
    --accent:    #0082bf;
    --accent-dk: #006494;
    --accent-gl: rgba(0,130,191,.10);
    --green:     #059669;
    --green-gl:  rgba(5,150,105,.08);
    --red:       #dc2626;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg:        #f0f4f8;
  --bg2:       #ffffff;
  --bg3:       #e8edf5;
  --border:    #d1d9e6;
  --fg:        #1a202c;
  --fg2:       #5a6480;
  --accent:    #0082bf;
  --accent-dk: #006494;
  --accent-gl: rgba(0,130,191,.10);
  --green:     #059669;
  --green-gl:  rgba(5,150,105,.08);
  --red:       #dc2626;
  color-scheme: light;
}

/* ── Reset / base ───────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--fg);
  min-height: 100%;
  padding-left:  max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}

/* ── Header ─────────────────────────────────────────────────────────── */
header {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 100;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 0;
}
#titulo-header {
  flex: 1;
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: -.01em;
}
#btn-config {
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--fg2);
  border-radius: var(--r-sm);
  padding: 8px 14px;
  cursor: pointer;
  font-size: 0.82rem;
  font-family: inherit;
  font-weight: 500;
  transition: background .15s, color .15s;
}
#btn-config:hover { background: var(--border); color: var(--fg); }

/* ── Config panel ───────────────────────────────────────────────────── */
#panel-config {
  display: none;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 16px 0 20px;
}
#panel-config label {
  display: block;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--fg2);
  letter-spacing: .06em;
  text-transform: uppercase;
  margin-top: 14px;
  margin-bottom: 6px;
}
#panel-config label:first-of-type { margin-top: 0; }
#panel-config input {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  color: var(--fg);
  font-family: inherit;
  font-size: 0.95rem;
  padding: 12px 14px;
  outline: none;
  transition: border-color .15s;
}
#panel-config input:focus { border-color: var(--accent); }
#btn-guardar {
  margin-top: 16px;
  width: 100%;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--r-sm);
  padding: 13px;
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s;
}
#btn-guardar:hover { background: var(--accent-dk); }

/* ── Filtros ─────────────────────────────────────────────────────────── */
#filtros {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 14px 0;
}
.fila-filtros {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: flex-end;
}
.fila-filtros label {
  display: block;
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--fg2);
  letter-spacing: .05em;
  text-transform: uppercase;
  margin-bottom: 5px;
}
.fila-filtros input,
.fila-filtros select {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  color: var(--fg);
  font-family: inherit;
  font-size: 0.9rem;
  padding: 11px 12px;
  width: 100%;
  outline: none;
  transition: border-color .15s;
  appearance: none;
  -webkit-appearance: none;
}
.fila-filtros input:focus,
.fila-filtros select:focus { border-color: var(--accent); }
.f-fecha { flex: 1; min-width: 140px; }
.f-monto { flex: 1; min-width: 120px; }
.f-tipo  { flex: 1; min-width: 140px; }

.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
#btn-buscar {
  flex: 1;
  min-width: 120px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--r-sm);
  padding: 13px 20px;
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s;
  white-space: nowrap;
}
#btn-buscar:hover { background: var(--accent-dk); }
#btn-excel {
  background: var(--green-gl);
  color: var(--green);
  border: 1px solid var(--green);
  border-radius: var(--r-sm);
  padding: 13px 18px;
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s;
  white-space: nowrap;
}
#btn-excel:hover { background: var(--green); color: #fff; }

/* ── Stats ───────────────────────────────────────────────────────────── */
#stats {
  display: flex;
  gap: 10px;
  padding: 14px 0;
  flex-wrap: wrap;
}
.stat-card {
  flex: 1;
  min-width: 130px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 14px 16px;
}
.stat-card .slabel {
  font-size: 0.7rem;
  font-weight: 600;
  color: var(--fg2);
  letter-spacing: .07em;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.stat-card .svalue {
  font-size: 1.35rem;
  font-weight: 700;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

/* ── Tabla ───────────────────────────────────────────────────────────── */
#tabla-wrap {
  overflow-x: auto;
  padding-bottom: 80px;
}
#msg {
  text-align: center;
  padding: 48px 16px;
  color: var(--fg2);
  font-size: 0.9rem;
}
table {
  width: 100%;
  border-collapse: collapse;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
  font-size: 0.87rem;
}
th {
  background: var(--bg3);
  padding: 11px 14px;
  text-align: left;
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--fg2);
  letter-spacing: .06em;
  text-transform: uppercase;
  white-space: nowrap;
  border-bottom: 1px solid var(--border);
}
td {
  padding: 11px 14px;
  border-top: 1px solid var(--border);
  color: var(--fg);
  font-variant-numeric: tabular-nums;
}
tr:hover td { background: var(--accent-gl); }
.col-id { color: var(--fg2); font-size: 0.78rem; }
.col-monto { text-align: right; font-weight: 500; }
.col-acum  { text-align: right; font-weight: 700; color: var(--green); }

/* ── Toast ───────────────────────────────────────────────────────────── */
#toast {
  position: fixed;
  bottom: max(24px, env(safe-area-inset-bottom, 0px));
  left: 50%;
  transform: translateX(-50%);
  background: var(--fg);
  color: var(--bg);
  padding: 11px 22px;
  border-radius: 20px;
  font-size: 0.85rem;
  font-weight: 500;
  opacity: 0;
  transition: opacity .25s;
  pointer-events: none;
  z-index: 999;
  white-space: nowrap;
}
#toast.show { opacity: 1; }
</style>

<!-- ── Markup ─────────────────────────────────────────────────────────── -->
<header>
  <h1 id="titulo-header">Cobros MP</h1>
  <button id="btn-config">⚙ Config</button>
</header>

<div id="panel-config">
  <label>Nombre del dashboard</label>
  <input id="cfg-nombre" type="text" placeholder="Ej: Cooperadora 2026">
  <label>Access Token de Mercado Pago</label>
  <input id="cfg-token" type="password" placeholder="APP_USR-…">
  <button id="btn-guardar">Guardar</button>
</div>

<div id="filtros">
  <div class="fila-filtros">
    <div class="f-fecha">
      <label>Desde</label>
      <input type="date" id="f-desde">
    </div>
    <div class="f-fecha">
      <label>Hasta</label>
      <input type="date" id="f-hasta">
    </div>
    <div class="f-monto">
      <label>Monto exacto</label>
      <input type="number" id="f-monto" placeholder="Ej: 55000">
    </div>
    <div class="f-tipo">
      <label>Tipo</label>
      <select id="f-tipo">
        <option value="received">Recibidos</option>
        <option value="sent">Realizados</option>
        <option value="all">Todos</option>
      </select>
    </div>
  </div>
  <div class="btn-row">
    <button id="btn-buscar">🔍 Buscar</button>
    <button id="btn-excel">📥 Exportar Excel</button>
  </div>
</div>

<div id="stats">
  <div class="stat-card">
    <div class="slabel">Registros</div>
    <div class="svalue" id="st-registros">—</div>
  </div>
  <div class="stat-card">
    <div class="slabel">Total aprobado</div>
    <div class="svalue" id="st-total">—</div>
  </div>
</div>

<div id="tabla-wrap">
  <div id="msg">Configurá tu token y hacé una búsqueda.</div>
  <table id="tabla" style="display:none">
    <thead>
      <tr>
        <th>Fecha</th>
        <th>ID</th>
        <th class="col-monto">Monto</th>
        <th class="col-acum">Acumulado</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<div id="toast"></div>

<script>
// ── Storage ──────────────────────────────────────────────────────────
function lsGet(k){ try{ return localStorage.getItem(k)||""; }catch(e){ return ""; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

// ── Init ─────────────────────────────────────────────────────────────
const hoy = new Date().toISOString().slice(0,10);
document.getElementById("f-desde").value = hoy;
document.getElementById("f-hasta").value = hoy;

const nombre = lsGet("mp_nombre") || "Cobros MP";
document.getElementById("titulo-header").textContent = nombre;
document.title = nombre;
document.getElementById("cfg-nombre").value = nombre;
document.getElementById("cfg-token").value  = lsGet("mp_token");

// ── Config panel ──────────────────────────────────────────────────────
document.getElementById("btn-config").onclick = () => {
  const p = document.getElementById("panel-config");
  p.style.display = p.style.display === "none" ? "block" : "none";
};
document.getElementById("btn-guardar").onclick = () => {
  const n = document.getElementById("cfg-nombre").value.trim() || "Cobros MP";
  const t = document.getElementById("cfg-token").value.trim();
  lsSet("mp_nombre", n);
  lsSet("mp_token",  t);
  document.getElementById("titulo-header").textContent = n;
  document.title = n;
  document.getElementById("panel-config").style.display = "none";
  toast("✅ Guardado");
};

// ── Buscar ────────────────────────────────────────────────────────────
let datosActuales = [];
document.getElementById("btn-buscar").onclick = buscar;

async function buscar(){
  const token = lsGet("mp_token");
  if(!token){ toast("⚠ Primero guardá tu Access Token en Config"); return; }

  const desde = document.getElementById("f-desde").value;
  const hasta = document.getElementById("f-hasta").value;
  const monto = document.getElementById("f-monto").value;
  const tipo  = document.getElementById("f-tipo").value;

  const msg = document.getElementById("msg");
  msg.textContent = "Consultando…";
  msg.style.display = "block";
  document.getElementById("tabla").style.display = "none";
  document.getElementById("st-registros").textContent = "—";
  document.getElementById("st-total").textContent = "—";

  const params = new URLSearchParams({ token, tipo, desde, hasta });
  if(monto) params.append("monto", monto);

  try {
    const res  = await fetch("/api/pagos?" + params);
    const data = await res.json();
    if(data.error){
      toast("❌ " + data.error);
      msg.textContent = "Error: " + data.error;
      return;
    }
    datosActuales = data.rows;
    renderTabla(data.rows, data.total);
  } catch(e) {
    toast("❌ Error de conexión");
    msg.textContent = "Error de conexión.";
  }
}

function fmt(n){
  if(n == null) return "—";
  return "$ " + Math.round(n).toLocaleString("es-AR");
}

function renderTabla(rows, total){
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  document.getElementById("st-registros").textContent = rows.length;
  document.getElementById("st-total").textContent = fmt(total);

  if(!rows.length){
    document.getElementById("msg").textContent = "Sin resultados para ese período.";
    document.getElementById("msg").style.display = "block";
    document.getElementById("tabla").style.display = "none";
    return;
  }

  rows.forEach(r => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${r.fecha}</td>
      <td class="col-id">${r.id}</td>
      <td class="col-monto">${fmt(r.monto)}</td>
      <td class="col-acum">${r.acumulado != null ? fmt(r.acumulado) : "—"}</td>
    `;
    tbody.appendChild(tr);
  });

  document.getElementById("msg").style.display = "none";
  document.getElementById("tabla").style.display = "table";
}

// ── Excel ─────────────────────────────────────────────────────────────
document.getElementById("btn-excel").onclick = exportarExcel;

function exportarExcel(){
  if(!datosActuales.length){ toast("Sin datos para exportar"); return; }
  let csv = "Fecha,ID,Monto,Acumulado\n";
  datosActuales.forEach(r => {
    csv += `"${r.fecha}","${r.id}","${r.monto}","${r.acumulado ?? ""}"\n`;
  });
  const blob = new Blob(["﻿"+csv], {type:"text/csv;charset=utf-8"});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href = url;
  a.download = (lsGet("mp_nombre")||"cobros") + "_" + new Date().toISOString().slice(0,10) + ".csv";
  a.click();
  URL.revokeObjectURL(url);
  toast("✅ Archivo descargado");
}

// ── Service Worker ────────────────────────────────────────────────────
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch(() => {});
}

// ── Toast ─────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2800);
}
</script>
